<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cozy Sounds</title>
<style>

[data-theme=forest]{--bg0:#0b1a14;--bg1:#12291f;--bg2:#1c3b2b;--bd:#3f7a54;--mut:#9fd1a8;--tx:#eef3d8;--ac:#f2d16b;--ink:#0b1a14;--warm:#f0975a;--ok:#8be28b;--info:#6fd0d8;--rose:#ff9ab0;--sh:#0b1a14;--pa:#eef0d2;--pb:#c4cc9a;--pi:#12291f}
[data-theme=sakura]{--bg0:#5a2d49;--bg1:#fff0f3;--bg2:#ffdde7;--bd:#d77a9b;--mut:#a8587a;--tx:#4a2340;--ac:#e0457b;--ink:#fff7f9;--warm:#e8743c;--ok:#2f9a55;--info:#3a8fd0;--rose:#e0457b;--sh:#8a4768;--pa:#fffaf5;--pb:#f2c6d4;--pi:#4a2340}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:transparent}

.card[data-on="1"] .st{background:var(--cc);color:var(--ink);border-color:var(--sh)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:1.5rem;background:transparent;cursor:pointer;display:block;margin:0}

.card:not([data-on="1"]) input[type=range]{opacity:.55}
/* narrow: one compact row per channel (icon+name+status | slider) so 5 cards always fit */
.grid{grid-template-columns:1fr;grid-auto-rows:1fr;gap:.45rem}
.card{flex-direction:row;align-items:center;justify-content:space-between;gap:.7rem;padding:.2rem .6rem}
.card .ctl{flex:1 1 0;min-width:0}
.card input[type=range]{flex:1 1 0;min-width:0;width:auto}
.ic{width:1.6rem;height:1.6rem}
.btn{padding:.45em .8em}
@media (max-height:200px){.panel{gap:.4rem;padding:.4rem .6rem .5rem}#viz{height:1.6rem}.grid{gap:.3rem}.card{padding:.05rem .5rem}.ic{width:1.3rem;height:1.3rem}input[type=range]{height:1.1rem}input[type=range]::-webkit-slider-runnable-track{height:.6rem}input[type=range]::-webkit-slider-thumb{height:1rem;width:.6rem;margin-top:-.3rem}}

 .grid{grid-template-columns:repeat(5,1fr);grid-auto-rows:auto;gap:.7rem}

 .ttl{font-size:1.1rem}
}
@media (max-width:330px){.ttl{display:none}.st{display:none}}

<script>
var $=function(i){return document.getElementById(i)};
var Q=new URLSearchParams(location.search);
function QP(k,d){var v=Q.get(k);return(v===null||v==='')?d:v}
function QNum(k,d,lo,hi){var v=parseFloat(QP(k,''));return(isFinite(v)&&v>=lo&&v<=hi)?v:d}
var RM=false;try{RM=matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
(function(){
  var de=document.documentElement;
  var th=String(QP('theme','moonlit')).toLowerCase();
  if(!/^(moonlit|dawn|forest|sakura|paper)$/.test(th))th='moonlit';
  de.setAttribute('data-theme',th);
  if(String(QP('bg','')).toLowerCase()==='transparent')de.setAttribute('data-bg','transparent');
  var ac=String(QP('accent','')).replace('#','');
  if(/^([0-9a-f]{3}|[0-9a-f]{6})$/i.test(ac)){
    if(ac.length===3)ac=ac.replace(/./g,'$&$&');
    var r=parseInt(ac.substr(0,2),16),g=parseInt(ac.substr(2,2),16),b=parseInt(ac.substr(4,2),16);
    de.style.setProperty('--ac','#'+ac);
    de.style.setProperty('--ink',(0.299*r+0.587*g+0.114*b)>150?'#1b1538':'#fff8ec');
  }
})();
function cssv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function makeStore(name){
  var mem={},pre='ql.'+name+'.'+String(QP('id','')).replace(/[^\w-]/g,'').slice(0,24)+'.';
  return{
    get:function(k,d){
      try{var v=localStorage.getItem(pre+k);if(v!==null)return JSON.parse(v)}catch(e){}
      return(k in mem)?mem[k]:d;
    },
    set:function(k,v){mem[k]=v;try{localStorage.setItem(pre+k,JSON.stringify(v))}catch(e){}}
  };
}
function pxIcon(rows,pal){
  var h=rows.length,w=rows[0].length,c=document.createElement('canvas');c.width=w;c.height=h;
  var x=c.getContext('2d');
  for(var j=0;j<h;j++)for(var i=0;i<w;i++){var ch=rows[j][i];if(ch!=='.'&&pal[ch]){x.fillStyle=pal[ch];x.fillRect(i,j,1,1)}}
  c.setAttribute('aria-hidden','true');return c;
}
function pad2(n){return(n<10?'0':'')+n}
function fitText(el,box,maxPx,minPx){
  var s=maxPx;el.style.fontSize=s+'px';
  while(s>minPx&&(el.scrollHeight>box.clientHeight||el.scrollWidth>box.clientWidth)){s-=1;el.style.fontSize=s+'px'}
}

(function(){
var ST=makeStore('sounds');
var DEFS=[
 {id:'brown',name:'Brown noise',c:'--warm',trim:1.0,def:{on:1,vol:45},icon:['..........','.#...#....','.#.#.#..#.','.#.#.#.##.','##.#.#.##.','##.###.##.','##.###.##.','##########']},
 {id:'rain',name:'Rain',c:'--info',trim:1.0,def:{on:0,vol:45},icon:['...###....','..#####...','.#######..','#########.','.#######..','..........','.#..#..#..','..#..#..#.','.#..#..#..']},
 {id:'fire',name:'Fireplace',c:'--ac',trim:1.0,def:{on:0,vol:45},icon:['....#.....','...##.#...','..###.##..','..####.#..','.###oo###.','.##ooooo#.','.##ooooo#.','..#oooo#..','...####...']},
 {id:'ocean',name:'Ocean waves',c:'--ok',trim:1.0,def:{on:0,vol:45},icon:['..........','.##....##.','#..#..#..#','....##....','..........','.##....##.','#..#..#..#','....##....']},
 {id:'pad',name:'Soft pad',c:'--rose',trim:1.0,def:{on:0,vol:45},icon:['....######','....#....#','....#....#','....#....#','.####..###','#####..###','.###......']}
];
var mixParam=QP('mix','');
var saved=ST.get('mix',null),mix={};
DEFS.forEach(function(d){
  var s=saved&&saved[d.id];
  if(s)mix[d.id]={on:s.on?1:0,vol:Math.max(0,Math.min(100,+s.vol||0))};
  else if(mixParam)mix[d.id]={on:mixParam.split(',').indexOf(d.id)>=0?1:0,vol:d.def.vol};
  else mix[d.id]={on:d.def.on,vol:d.def.vol};
});
function persist(){ST.set('mix',mix)}
var playing=false,ctx=null,eng=null,an=null,sched=null;
var cards={};
var grid=$('grid');
DEFS.forEach(function(d){
  var el=document.createElement('div');el.className='card';el.style.setProperty('--cc','var('+d.c+')');
  el.innerHTML='<button class="ctl" aria-pressed="false"><span class="ic"></span><span class="nm"></span><span class="st">OFF</span></button><input type="range" min="0" max="100" step="1">';
  el.querySelector('.nm').textContent=d.name;
  var pal={'#':cssv(d.c),'o':cssv('--ac')};if(d.id==='fire')pal['#']=cssv('--warm');
  el.querySelector('.ic').appendChild(pxIcon(d.icon,pal));
  var btn=el.querySelector('.ctl'),rg=el.querySelector('input');
  rg.setAttribute('aria-label',d.name+' volume');rg.value=mix[d.id].vol;
  btn.addEventListener('click',function(){toggle(d.id)});
  rg.addEventListener('input',function(){mix[d.id].vol=+rg.value;paint(d.id);apply(d.id,'quick');persist()});
  grid.appendChild(el);cards[d.id]={el:el,btn:btn,rg:rg,st:el.querySelector('.st')};paint(d.id);
});
function paint(id){
  var m=mix[id],c=cards[id];c.el.dataset.on=m.on;c.el.dataset.play=playing?1:0;
  c.btn.setAttribute('aria-pressed',m.on?'true':'false');c.btn.setAttribute('aria-label',DEFS.filter(function(d){return d.id===id})[0].name+(m.on?' is on. Turn off':' is off. Turn on'));
  c.st.textContent=m.on?'ON':'OFF';c.rg.style.setProperty('--v',m.vol+'%');
}
/*ENGINE*/
function QLEngine(ctx){
  var sr=ctx.sampleRate,R=Math.random,E={ch:{},on:{},dbg:{}};
  var TWO=Math.PI/2;
  function flt(type,f,q){var n=ctx.createBiquadFilter();n.type=type;n.frequency.value=f;n.Q.value=(q==null?0.707:q);return n}
  function gn(v){var g=ctx.createGain();g.gain.value=v;return g}
  function osc(type,f,det){var o=ctx.createOscillator();o.type=type;o.frequency.value=f;if(det)o.detune.value=det;return o}
  function lfo(freq,depth,param,ph){var o=osc('sine',freq),g=gn(depth);o.connect(g);g.connect(param);o.start(ctx.currentTime+(ph||0));return o}
  /* long stereo noise buffers, ends crossfaded so the loop has no seam */
  function mkBuf(kind){
    var L=Math.floor(sr*10),N=Math.floor(sr*1.5),b=ctx.createBuffer(2,L,sr);
    for(var c=0;c<2;c++){
      var raw=new Float32Array(L+N),y=0,b0=0,b1=0,b2=0,ss=0,i;
      for(i=-4000;i<raw.length;i++){
        var w=R()*2-1,v;
        if(kind==='brown'){y=0.998*y+0.02*w;v=y}
        else{b0=0.99765*b0+w*0.099046;b1=0.963*b1+w*0.2965164;b2=0.57*b2+w*1.0526913;v=b0+b1+b2+w*0.1848}
        if(i>=0){raw[i]=v;ss+=v*v}
      }
      var k=0.2/Math.sqrt(ss/raw.length),o=b.getChannelData(c);
      for(i=0;i<L;i++){
        if(i<N){var a=TWO*i/N;o[i]=(raw[i]*Math.sin(a)+raw[L+i]*Math.cos(a))*k}
        else o[i]=raw[i]*k;
      }
    }
    return b;
  }
  function src(buf){var s=ctx.createBufferSource();s.buffer=buf;s.loop=true;s.start(ctx.currentTime,R()*(buf.duration-0.1));return s}
  var brown=mkBuf('brown'),pink=mkBuf('pink');
  /* master chain: sum -> gentle lowpass -> soft compressor -> limiter -> master gain */
  var sum=gn(1),mlp=flt('lowpass',8000,0.5),comp=ctx.createDynamicsCompressor(),lim=ctx.createDynamicsCompressor();
  comp.threshold.value=-14;comp.knee.value=20;comp.ratio.value=3;comp.attack.value=0.03;comp.release.value=0.4;
  lim.threshold.value=-4;lim.knee.value=2;lim.ratio.value=20;lim.attack.value=0.004;lim.release.value=0.25;
  var master=gn(0);
  sum.connect(mlp);mlp.connect(comp);comp.connect(lim);lim.connect(master);
  E.out=master;E.master=master;E.MASTER=0.35;
  function chan(id){var o=gn(0);o.connect(sum);E.ch[id]={out:o,tgt:0,next:0};return o}
  var out,n,a,b,c,d;
  /* BROWN: deep and warm */
  out=chan('brown');n=src(brown);a=flt('lowpass',500,0.6);b=flt('highshelf',1800,0);b.gain.value=-6;c=gn(1.6);
  n.connect(a);a.connect(b);b.connect(c);c.connect(out);
  /* RAIN: steady rain on a window */
  out=chan('rain');
  n=src(pink);a=flt('highpass',350,0.5);b=flt('lowpass',3000,0.5);c=gn(1);d=gn(1.5);
  n.connect(a);a.connect(b);b.connect(c);c.connect(d);d.connect(out);
  lfo(0.083,0.12,c.gain);lfo(0.137,0.08,c.gain,1.3);lfo(0.11,0.05,c.gain,2.1);
  n=src(brown);a=flt('lowpass',320,0.5);b=gn(0.9);n.connect(a);a.connect(b);b.connect(out);
  var dropBus=gn(1),dropLP=flt('lowpass',3200,0.5);dropBus.connect(dropLP);dropLP.connect(out);
  /* FIRE: low rumble + soft crackles */
  out=chan('fire');
  var rumble=gn(1.5),crack=gn(4);
  n=src(brown);a=flt('lowpass',250,0.5);c=gn(1);n.connect(a);a.connect(c);c.connect(rumble);
  lfo(0.23,0.12,c.gain);lfo(0.37,0.08,c.gain,0.7);
  rumble.connect(out);
  var crLP=flt('lowpass',3800,0.5);crack.connect(crLP);crLP.connect(out);
  E.dbg.fireRumble=rumble;E.dbg.fireCrack=crack;
  /* OCEAN: slow asymmetric swells */
  out=chan('ocean');
  function track(f0,f1,g0,g1,srcs,wash){
    var mixn=gn(1),lp=flt('lowpass',f0,0.4),g=gn(g0),t={t:0,f0:f0,f1:f1,g0:g0,g1:g1,fp:lp.frequency,gp:g.gain};
    srcs.forEach(function(s){var x=gn(s[1]);s[0].connect(x);x.connect(mixn)});
    mixn.connect(lp);lp.connect(g);g.connect(out);
    if(wash){var w=src(pink),bp=flt('bandpass',1700,0.5),wl=flt('lowpass',3000,0.5),wg=gn(0);w.connect(bp);bp.connect(wl);wl.connect(wg);wg.connect(out);t.wp=wg.gain;t.wmax=wash}
    return t;
  }
  var wv1=track(220,1300,0.34,1.7,[[src(brown),1.2],[src(pink),0.6]],0.17);
  var wv2=track(180,800,0.2,0.68,[[src(pink),1.0]],0);
  wv1.fp.setValueAtTime(wv1.f0,0);wv1.gp.setValueAtTime(wv1.g0,0);wv1.wp.setValueAtTime(0,0);
  wv2.fp.setValueAtTime(wv2.f0,0);wv2.gp.setValueAtTime(wv2.g0,0);
  function waves(tr,until,tmin,tspan){
    var now=ctx.currentTime;if(!tr.t)tr.t=now+0.05;
    while(tr.t<until){
      var T=tmin+R()*tspan,pk=0.75+R()*0.25,N=512,fc=new Float32Array(N),gc=new Float32Array(N),wc=new Float32Array(N),rise=0.55;
      for(var i=0;i<N;i++){
        var u=i/(N-1),e=u<rise?Math.pow(Math.sin(TWO*u/rise),2):Math.pow(Math.cos(TWO*(u-rise)/(1-rise)),2);e*=pk;
        fc[i]=tr.f0*Math.pow(tr.f1/tr.f0,e);gc[i]=tr.g0+(tr.g1-tr.g0)*e;wc[i]=tr.wp?tr.wmax*e*e*e:0;
      }
      fc[N-1]=tr.f0;gc[N-1]=tr.g0;wc[N-1]=0;
      tr.fp.setValueCurveAtTime(fc,tr.t,T);tr.gp.setValueCurveAtTime(gc,tr.t,T);
      if(tr.wp)tr.wp.setValueCurveAtTime(wc,tr.t,T);
      tr.t+=T+0.002;
    }
  }
  /* PAD: slow lo-fi drone drifting between Cmaj9 and Am9 voicings */
  out=chan('pad');
  var CH=[[130.81,196,293.66,329.63],[110,164.81,196,246.94]],pad={t:0,idx:0,gains:[]};
  var padLP=flt('lowpass',800,0.3),padSum=gn(0.84);
  lfo(0.05,220,padLP.frequency);lfo(0.031,120,padLP.frequency,3);
  CH.forEach(function(ch,ci){
    var cg=gn(ci===0?1:0);pad.gains.push(cg);
    ch.forEach(function(f,vi){

      [-2.5,2.5].forEach(function(det){var o=osc(vi===0?'triangle':'sine',f,det);var og=gn(vi===0?0.2:0.16);o.connect(og);og.connect(vg);o.start(ctx.currentTime)});

  padLP.connect(padSum);
  var dl=ctx.createDelay(1.5);dl.delayTime.value=0.47;var fb=gn(0.38),dlp=flt('lowpass',1300,0.5),wet=gn(0.45);
  padSum.connect(out);padSum.connect(dl);dl.connect(dlp);dlp.connect(fb);fb.connect(dl);dlp.connect(wet);wet.connect(out);
  /* one-shot droplets / crackles (always enveloped and lowpassed) */
  function drop(t){

  function crackle(t,big){

/* audio glue */
function lvl(id){var d=DEFS.filter(function(x){return x.id===id})[0],m=mix[id];return m.on?Math.pow(m.vol/100,1.5)*d.trim:0}
function ensure(){
  if(eng)return true;
  try{
    var C=window.AudioContext||window.webkitAudioContext;if(!C)return false;

    eng.out.connect(an);an.connect(ctx.destination);

    return true;
  }catch(e){ctx=null;eng=null;return false}
}
function apply(id,mode){
  if(!eng)return;eng.on[id]=mix[id].on;eng.setLevel(id,lvl(id),mode||'quick');
}
function schedule(){if(eng&&playing)eng.schedule(ctx.currentTime+1.2)}
function play(){
  if(!ensure())return;playing=true;
  var p=ctx.resume();if(p&&p.catch)p.catch(function(){});

  if(!sched)sched=setInterval(schedule,100);schedule();ui();

function pause(){

    setTimeout(function(){if(!playing&&ctx&&ctx.state==='running')ctx.suspend()},2200)}

}
function toggle(id){

}
function ui(){var b=$('play');b.textContent=playing?'Pause':'Play';b.setAttribute('aria-label',playing?'Pause ambient mix':'Play ambient mix');DEFS.forEach(function(d){paint(d.id)})}
$('play').addEventListener('click',function(){if(playing)pause();else play()});
document.addEventListener('keydown',function(e){if((e.key===' '||e.code==='Space')&&e.target===document.body){e.preventDefault();$('play').click()}});
/* visualizer */
var cv=$('viz'),vx=cv.getContext('2d'),BARS=16,lv=[],data=new Uint8Array(32),last=0,SC=3;
function vsize(){var w=Math.max(8,Math.floor(cv.clientWidth/SC)),h=Math.max(4,Math.floor(cv.clientHeight/SC));if(w!==cv.width||h!==cv.height){cv.width=w;cv.height=h}BARS=Math.max(4,Math.floor(cv.width/3));while(lv.length<BARS)lv.push(0)}
addEventListener('resize',vsize);
function viz(ts){
  requestAnimationFrame(viz);if(ts-last<(RM?250:90))return;last=ts;
  vsize();
  var W=cv.width,H=cv.height,off=Math.floor((W-BARS*3)/2),t=ts/1000,anyOn=false;
  for(var k=0;k<DEFS.length;k++)if(mix[DEFS[k].id].on)anyOn=true;
  if(playing&&an){an.getByteFrequencyData(data)}
  var cols=[cssv('--info'),cssv('--ok'),cssv('--ac'),cssv('--warm')],idle=cssv('--bd');
  vx.clearRect(0,0,W,H);
  for(var b=0;b<BARS;b++){
    var target;
    if(playing&&anyOn&&an){var bin=Math.min(31,Math.floor(Math.pow(b/BARS,1.5)*28)),v=data[bin]/255;target=Math.pow(v,1.4)*(H-1)*1.3+(RM?0:Math.sin(t*3+b)*0.5)}
    else target=1+(RM?0:(Math.sin(t*1.6+b*0.7)+1)*0.6);
    lv[b]+=(target-lv[b])*0.55;var h=Math.max(1,Math.min(H-1,Math.round(lv[b])));
    vx.fillStyle=playing?cols[Math.min(3,Math.floor(h/H*4))]:idle;
    vx.fillRect(off+b*3,H-h,2,h);
  }
}
ui();requestAnimationFrame(viz);
})();
