<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boss Battle</title>
<style>
@font-face{font-family:PS2P;src:url(../fonts/PressStart2P.ttf);font-display:swap}
@font-face{font-family:Silk;src:url(../fonts/Silkscreen.ttf);font-display:swap}
@font-face{font-family:VT;src:url(../fonts/VT323.ttf);font-display:swap}
:root{--bg0:#0e0b26;--bg1:#1b1538;--bg2:#2a2150;--bd:#5b3f8c;--mut:#a99be6;--tx:#f4ead5;--ac:#ffcf6b;--ink:#0e0b26;--warm:#ff8a5c;--ok:#7bd389;--info:#6ec6ff;--rose:#ff7aa2;--sh:#0e0b26;--pa:#f4ead5;--pb:#d8c59a;--pi:#2a2150}
[data-theme=dawn]{--bg0:#2b1428;--bg1:#43203a;--bg2:#5e2c47;--bd:#a8506a;--mut:#f0b5a0;--tx:#fff1e0;--ac:#ffb454;--ink:#2b1428;--warm:#ff7a5c;--ok:#9ae08a;--info:#7fd0ff;--rose:#ff8fb1;--sh:#2b1428;--pa:#fff0d6;--pb:#e8c49a;--pi:#43203a}
[data-theme=forest]{--bg0:#0b1a14;--bg1:#12291f;--bg2:#1c3b2b;--bd:#3f7a54;--mut:#9fd1a8;--tx:#eef3d8;--ac:#f2d16b;--ink:#0b1a14;--warm:#f0975a;--ok:#8be28b;--info:#6fd0d8;--rose:#ff9ab0;--sh:#0b1a14;--pa:#eef0d2;--pb:#c4cc9a;--pi:#12291f}
[data-theme=sakura]{--bg0:#5a2d49;--bg1:#fff0f3;--bg2:#ffdde7;--bd:#d77a9b;--mut:#a8587a;--tx:#4a2340;--ac:#e0457b;--ink:#fff7f9;--warm:#e8743c;--ok:#2f9a55;--info:#3a8fd0;--rose:#e0457b;--sh:#8a4768;--pa:#fffaf5;--pb:#f2c6d4;--pi:#4a2340}
[data-theme=paper]{--bg0:#3b3326;--bg1:#f3ead7;--bg2:#e6d9bc;--bd:#8c7a58;--mut:#7a6a4c;--tx:#2f2a20;--ac:#b5651d;--ink:#fbf4e2;--warm:#c4501f;--ok:#4d8a3b;--info:#2f6f9f;--rose:#b8486a;--sh:#6b5d44;--pa:#fbf4e2;--pb:#dccba5;--pi:#2f2a20}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:transparent}
body{font-family:Silk,monospace;color:var(--tx);-webkit-font-smoothing:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.panel{position:absolute;inset:0 4px 4px 0;background:var(--bg1);border:4px solid var(--bd);box-shadow:4px 4px 0 var(--sh),inset 0 0 0 2px var(--bg0);overflow:hidden}
[data-bg=transparent] .panel{background:transparent;border:0;box-shadow:none;inset:0}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated}
.btn{font-family:Silk,monospace;font-size:var(--bfs,1rem);line-height:1;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);background:var(--ac);border:2px solid var(--sh);padding:.6em .9em;cursor:pointer;position:relative;transform:translateY(-2px);box-shadow:0 4px 0 var(--sh),inset 0 2px 0 rgba(255,255,255,.3),inset 0 -2px 0 rgba(0,0,0,.2);display:inline-flex;align-items:center;justify-content:center;gap:.5em;white-space:nowrap}
.btn.ghost{background:var(--bg2);color:var(--tx);border-color:var(--bd);box-shadow:0 4px 0 var(--bd),inset 0 2px 0 rgba(255,255,255,.1),inset 0 -2px 0 rgba(0,0,0,.2)}
.btn:hover{filter:brightness(1.08)}
.btn:active,.btn.pressed{transform:translateY(0);box-shadow:0 2px 0 var(--sh),inset 0 2px 0 rgba(0,0,0,.15)}
.btn.ghost:active,.btn.ghost.pressed{box-shadow:0 2px 0 var(--bd),inset 0 2px 0 rgba(0,0,0,.15)}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px dashed var(--tx);outline-offset:3px}
.btn[aria-pressed=false].tog{opacity:.7}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}

@property --v{syntax:'<percentage>';inherits:false;initial-value:100%}
html{font-size:clamp(9px,min(2.4vw,4.3vh),15px);color-scheme:dark}
[data-theme=sakura],[data-theme=paper]{color-scheme:light}
.panel{display:flex;flex-direction:column;justify-content:space-between;gap:.7rem;padding:.8rem 1.1rem 1rem;--hp:var(--rose)}
.row1{display:flex;align-items:center;gap:.9rem;min-height:0;flex:0 0 auto}
.boss{flex:0 0 auto;width:3.4rem;height:3.4rem;position:relative}
.boss canvas{width:100%;height:100%;display:block;animation:bob 1s steps(1) infinite}
@keyframes bob{50%{transform:translateY(-.2rem)}}
.boss.dead canvas{animation:none;filter:grayscale(1);transform:rotate(-90deg) scale(.9) translateX(.2rem)}
.boss .zz{display:none;position:absolute;left:-.1rem;top:-.5rem;font-family:PS2P,monospace;font-size:.8rem;color:var(--ac);animation:blink .8s steps(1) infinite}
.boss.dead .zz{display:block}
@keyframes blink{50%{opacity:.2}}
.tt{flex:1;min-width:0}
.name{font-family:PS2P,monospace;font-size:1.25rem;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ac);text-shadow:.1em .1em 0 var(--bg0)}
[data-bg=transparent] .name{text-shadow:none}
.sub{font-family:VT,monospace;font-size:1.45rem;line-height:1;color:var(--mut);margin-top:.35rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.edit{--bfs:.8rem;padding:.5em .7em}
.tiles{flex:1;min-height:0;display:flex;gap:.6rem;align-items:stretch}
.tile{flex:1;min-width:0;background:var(--bg0);border:2px solid var(--bd);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;padding:.4rem .2rem;box-shadow:inset 0 -.3rem 0 rgba(255,255,255,.05)}
[data-theme=sakura] .tile,[data-theme=paper] .tile{background:var(--bg2);box-shadow:none}
.tile.wide{flex:1.45}
.tile .n{font-family:PS2P,monospace;font-size:min(3.2rem,calc((100vw - 8px - 4.4rem - 1.8rem)/4.45/2.2));line-height:1;color:var(--tx);white-space:nowrap}
.tile .n.tick{animation:tk .18s steps(2)}
@keyframes tk{0%{transform:translateY(.2rem);opacity:.6}}
.tile .l{font-family:Silk,monospace;font-size:.8rem;letter-spacing:.1em;color:var(--mut);text-transform:uppercase}
.tile.s .n{color:var(--warm)}
.hp{display:flex;align-items:center;gap:.7rem;flex:0 0 auto}
.hpl{font-family:PS2P,monospace;font-size:.95rem;color:var(--hp)}
.hpbar{flex:1;height:1.4rem;border:2px solid var(--sh);background:repeating-linear-gradient(90deg,transparent 0 .5rem,var(--bg0) .5rem .65rem),linear-gradient(90deg,var(--hp) var(--v),var(--bg2) var(--v));transition:--v 1s steps(10);box-shadow:0 0 0 2px var(--bd)}
.panel.low .hpbar{animation:blink .6s steps(1) infinite}
.hpv{font-family:Silk,monospace;font-size:1rem;min-width:3.3em;text-align:right;color:var(--tx)}
.panel.mid{--hp:var(--warm)}
.panel.dead .tiles,.panel.dead .hp{display:none}
.win{display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.7rem;min-height:0}
.panel.dead .win{display:flex}
.win .big{font-family:PS2P,monospace;font-size:min(2.4rem,calc((100vw - 5rem)/17));line-height:1.3;color:var(--ac);text-shadow:.1em .1em 0 var(--bg0);animation:pulse 1.2s steps(2) infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.win .msg{font-family:VT,monospace;font-size:2rem;color:var(--tx);line-height:1}
.setup{display:none;flex:1;min-height:0;flex-direction:column;justify-content:center;gap:.7rem}
.panel.setup-on .setup{display:flex}
.panel.setup-on .tiles,.panel.setup-on .hp,.panel.setup-on .win,.panel.setup-on .edit{display:none}
.setup label{font-family:Silk,monospace;font-size:.8rem;letter-spacing:.08em;color:var(--mut);text-transform:uppercase;display:flex;flex-direction:column;gap:.3rem;flex:1;min-width:0}
.setup .f{display:flex;gap:.7rem;align-items:flex-end}
.setup input{font-family:Silk,monospace;font-size:1rem;color:var(--tx);background:var(--bg0);border:2px solid var(--bd);padding:.5em .6em;width:100%;min-width:0;border-radius:0}
[data-theme=sakura] .setup input,[data-theme=paper] .setup input{background:#fff}
.setup .btn{--bfs:1rem;flex:0 0 auto}
.setup .hint{font-family:VT,monospace;font-size:1.3rem;color:var(--mut);line-height:1}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
@media (max-height:175px){.sub{display:none}.hpv{display:none}}
</style></head><body>
<div class="panel" id="panel">
 <div class="row1">
  <div class="boss" id="boss"><canvas id="bc" width="12" height="12" aria-hidden="true"></canvas><span class="zz" aria-hidden="true">z</span></div>
  <div class="tt"><div class="name" id="name">Final Boss</div><div class="sub" id="sub"></div></div>
  <button class="btn ghost edit" id="edit" aria-label="Edit boss date">Edit</button>
 </div>
 <div class="tiles" role="timer" aria-label="Time until deadline">
  <div class="tile wide"><div class="n" id="d">00</div><div class="l">Days</div></div>
  <div class="tile"><div class="n" id="h">00</div><div class="l">Hrs</div></div>
  <div class="tile"><div class="n" id="m">00</div><div class="l">Min</div></div>
  <div class="tile s"><div class="n" id="s">00</div><div class="l">Sec</div></div>
 </div>
 <div class="hp"><span class="hpl">HP</span><div class="hpbar" id="hpbar" role="img" aria-label="Boss health"></div><span class="hpv" id="hpv">100%</span></div>
 <div class="win"><div class="big">Boss defeated?</div><div class="msg">You showed up. That's the win.</div></div>
 <form class="setup" id="setup" autocomplete="off">
  <div class="f"><label>Boss name<input id="fn" maxlength="24" placeholder="Final Boss" aria-label="Boss name"></label></div>
  <div class="f"><label>Deadline<input id="fd" type="date" required aria-label="Deadline date"></label><button class="btn" type="submit" aria-label="Save deadline">Set</button></div>
 </form>
 <canvas id="fx" aria-hidden="true"></canvas>
</div>
<script>
var $=function(i){return document.getElementById(i)};
var Q=new URLSearchParams(location.search);
function QP(k,d){var v=Q.get(k);return(v===null||v==='')?d:v}
function QNum(k,d,lo,hi){var v=parseFloat(QP(k,''));return(isFinite(v)&&v>=lo&&v<=hi)?v:d}
var RM=false;try{RM=matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
(function(){
  var de=document.documentElement;
  var th=String(QP('theme','moonlit')).toLowerCase();
  if(!/^(moonlit|dawn|forest|sakura|paper)$/.test(th))th='moonlit';
  de.setAttribute('data-theme',th);
  if(String(QP('bg','')).toLowerCase()==='transparent')de.setAttribute('data-bg','transparent');
  var ac=String(QP('accent','')).replace('#','');
  if(/^([0-9a-f]{3}|[0-9a-f]{6})$/i.test(ac)){
    if(ac.length===3)ac=ac.replace(/./g,'$&$&');
    var r=parseInt(ac.substr(0,2),16),g=parseInt(ac.substr(2,2),16),b=parseInt(ac.substr(4,2),16);
    de.style.setProperty('--ac','#'+ac);
    de.style.setProperty('--ink',(0.299*r+0.587*g+0.114*b)>150?'#1b1538':'#fff8ec');
  }
})();
function cssv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function makeStore(name){
  var mem={},pre='ql.'+name+'.'+String(QP('id','')).replace(/[^\w-]/g,'').slice(0,24)+'.';
  return{
    get:function(k,d){
      try{var v=localStorage.getItem(pre+k);if(v!==null)return JSON.parse(v)}catch(e){}
      return(k in mem)?mem[k]:d;
    },
    set:function(k,v){mem[k]=v;try{localStorage.setItem(pre+k,JSON.stringify(v))}catch(e){}}
  };
}
function pxIcon(rows,pal){
  var h=rows.length,w=rows[0].length,c=document.createElement('canvas');c.width=w;c.height=h;
  var x=c.getContext('2d');
  for(var j=0;j<h;j++)for(var i=0;i<w;i++){var ch=rows[j][i];if(ch!=='.'&&pal[ch]){x.fillStyle=pal[ch];x.fillRect(i,j,1,1)}}
  c.setAttribute('aria-hidden','true');return c;
}
function pad2(n){return(n<10?'0':'')+n}
function fitText(el,box,maxPx,minPx){
  var s=maxPx;el.style.fontSize=s+'px';
  while(s>minPx&&(el.scrollHeight>box.clientHeight||el.scrollWidth>box.clientWidth)){s-=1;el.style.fontSize=s+'px'}
}

(function(){
var ST=makeStore('countdown');
function parse(s){var m=/^\s*(\d{4})-(\d{2})-(\d{2})(?:[T ](\d{1,2}):(\d{2}))?\s*$/.exec(String(s||''));if(!m)return null;var d=new Date(+m[1],+m[2]-1,+m[3],+(m[4]||0),+(m[5]||0));return isNaN(d.getTime())?null:d.getTime()}
function ymd(ms){var d=new Date(ms);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
var MON=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
var urlDate=QP('date','')||'',lockedByUrl=!!parse(urlDate);
var cfg=ST.get('cfg',{date:'',title:''});
var title=String(QP('title',(lockedByUrl?'':cfg.title)||'Final Boss')).slice(0,24);
var dateStr=lockedByUrl?urlDate:cfg.date;
var deadline=parse(dateStr),start=null;
var panel=$('panel'),els={d:$('d'),h:$('h'),m:$('m'),s:$('s')},lastVals={};
function storageOK(){try{localStorage.setItem('ql.t','1');localStorage.removeItem('ql.t');return true}catch(e){return false}}
var persistent=storageOK();
function computeStart(){
  start=null;if(deadline===null)return;
  var sp=parse(QP('start',''));if(sp!==null&&sp<deadline){start=sp;return}
  var key='first.'+dateStr,f=ST.get(key,null);
  if(f===null||f>=deadline){f=Date.now();if(f>=deadline)f=deadline-30*864e5;ST.set(key,f)}
  start=f;
  if(!persistent)start=Math.min(start,deadline-Math.max(deadline-Date.now(),30*864e5));
}
/* boss sprite */
var bc=$('bc'),SP=['..c......c..','.cc......cc.','.c.######.c.','..########..','.##########.','.#ww####ww#.','##wk####kw##','############','#vvvvvvvvvv#','#vtvtvvtvtv#','.##vvvvvv##.','..########..'];
var SPX=['..c......c..','.cc......cc.','.c.######.c.','..########..','.##########.','.#xx####xx#.','##xx####xx##','############','#vvvvvvvvvv#','#vtvtvvtvtv#','.##vvvvvv##.','..########..'];
function drawBoss(dead){
  var pal={'#':cssv('--warm'),c:cssv('--tx'),w:'#fff8ec',k:'#0e0b26',x:'#0e0b26',v:'#2a0f1e',t:'#fff8ec'};
  var ic=pxIcon(dead?SPX:SP,pal),x=bc.getContext('2d');x.clearRect(0,0,12,12);x.drawImage(ic,0,0);
}
/* fx */
var fx=$('fx'),fc=fx.getContext('2d'),parts=[],fxRun=false,lastT=0,acc=0,nextBurst=0;
function fxSize(){var r=panel.getBoundingClientRect();fx.width=Math.max(1,Math.round(r.width/2));fx.height=Math.max(1,Math.round(r.height/2))}
function burst(){
  var cols=[cssv('--ac'),cssv('--warm'),cssv('--ok'),cssv('--info'),cssv('--rose')];
  var cx=fx.width*(0.25+Math.random()*0.5),cy=fx.height*0.4;
  for(var i=0;i<45;i++){var a=Math.random()*Math.PI*2,sp=30+Math.random()*90;parts.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-60,s:Math.random()<0.3?3:2,c:cols[i%cols.length],life:1+Math.random()*0.8})}
}
function fxLoop(now){
  if(!fxRun)return;var dt=Math.min(0.05,(now-lastT)/1000);lastT=now;acc+=dt;
  if(acc>=0.08){var st=acc;acc=0;nextBurst-=st;if(nextBurst<=0){burst();nextBurst=2.2}
    fc.clearRect(0,0,fx.width,fx.height);
    for(var i=parts.length-1;i>=0;i--){var p=parts[i];p.vy+=240*st;p.x+=p.vx*st;p.y+=p.vy*st;p.vx*=0.985;p.life-=st;if(p.life<=0){parts.splice(i,1);continue}
      fc.fillStyle=p.c;fc.fillRect(Math.round(p.x),Math.round(p.y),p.s,p.s)}}
  requestAnimationFrame(fxLoop);
}
function startFx(){if(RM||fxRun)return;fxSize();fxRun=true;nextBurst=0;lastT=performance.now();requestAnimationFrame(fxLoop)}
function stopFx(){fxRun=false;parts=[];fc.clearRect(0,0,fx.width,fx.height)}
/* render */
var dead=false,first=true;
function setNum(k,v,wide){var t=pad2(v);if(lastVals[k]===t)return;var had=k in lastVals;lastVals[k]=t;els[k].textContent=t;
  if(had&&!RM){els[k].classList.remove('tick');void els[k].offsetWidth;els[k].classList.add('tick')}}
function render(){
  $('name').textContent=title;document.title='Boss Battle - '+title;
  if(deadline===null){if(first){drawBoss(false);first=false}panel.classList.add('setup-on');$('edit').style.display='none';return}
  panel.classList.remove('setup-on');$('edit').style.display=lockedByUrl?'none':'';
  var d=new Date(deadline);
  $('sub').textContent=MON[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear()+(d.getHours()||d.getMinutes()?' '+pad2(d.getHours())+':'+pad2(d.getMinutes()):'');
  var rem=deadline-Date.now(),isDead=rem<=0;
  if(isDead!==dead||first){dead=isDead;panel.classList.toggle('dead',dead);$('boss').classList.toggle('dead',dead);drawBoss(dead);if(dead)startFx();else stopFx()}
  rem=Math.max(0,rem);var s=Math.floor(rem/1000);
  var dd=Math.floor(s/86400),hh=Math.floor(s%86400/3600),mm=Math.floor(s%3600/60),ss=s%60;
  setNum('d',dd);setNum('h',hh);setNum('m',mm);setNum('s',ss);
  els.d.parentNode.classList.toggle('wide',dd>=100);
  var frac=start===null?1:Math.max(0,Math.min(1,(deadline-Date.now())/(deadline-start))),pct=Math.round(frac*100);
  var bar=$('hpbar');
  if(first&&!RM){bar.style.setProperty('--v','100%');requestAnimationFrame(function(){requestAnimationFrame(function(){bar.style.setProperty('--v',(frac*100)+'%')})})}else bar.style.setProperty('--v',(frac*100)+'%');
  $('hpv').textContent=pct+'%';bar.setAttribute('aria-label','Boss health '+pct+' percent');
  panel.classList.toggle('mid',frac<0.4);panel.classList.toggle('low',frac<0.12&&!dead);
  first=false;
}
function openSetup(){
  $('fn').value=title==='Final Boss'&&!cfg.title?'':title;$('fd').value=deadline!==null?ymd(deadline):'';
  panel.classList.add('setup-on');$('fd').focus();
}
$('edit').addEventListener('click',openSetup);
$('setup').addEventListener('submit',function(e){
  e.preventDefault();var v=$('fd').value,t=parse(v);if(t===null){$('fd').focus();return}
  title=($('fn').value.trim()||'Final Boss').slice(0,24);dateStr=v;deadline=t;cfg={date:v,title:title};ST.set('cfg',cfg);
  ST.set('first.'+v,Date.now());computeStart();first=true;lastVals={};render();
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&panel.classList.contains('setup-on')&&deadline!==null){render()}});
computeStart();render();
setInterval(render,250);
addEventListener('resize',function(){if(fxRun)fxSize()});
})();
</script></body></html>
